<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login Admin - Price List Almair</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>🌿🌊 𝐏𝐑𝐈𝐂𝐄 𝐋𝐈𝐒𝐓 — 𝑹𝒆𝒔𝒆𝒍𝒍𝒆𝒓 𝑩𝒚 𝑨𝒍𝒎𝒂𝒊𝒓 🌊🌿</h1>
      <p class="subtitle">✨ Premium Access Murah, Aman, Bergaransi!</p>
    </header>

    <section class="login-section">
      <div class="login-form">
        <input type="password" id="adminPassword" placeholder="Masukkan password admin" />
        <button onclick="login()">Masuk sebagai Admin</button>
        <button onclick="goUser ()">Masuk sebagai User</button>
      </div>
    </section>
  </div>

  <script>
    function login() {
      const pw = document.getElementById('adminPassword').value;
      if (pw === 'admin123') {
        window.location.href = 'admin.html';
      } else {
        alert('Password admin salah!');
      }
    }
    function goUser () {
      window.location.href = 'user.html';
    }
  </script>
</body>
</html>
